# Comprueba en cada push que requirements.txt se instala en Linux, macOS y Windows
# y que las librerías del proyecto se pueden importar con la versión declarada.
name: Instalación en Linux, macOS y Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  instalar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar requirements.txt
        run: python -m pip install -r requirements.txt

      - name: Importar las librerías y comparar sus versiones con requirements.txt
        shell: python
        run: |
          import importlib, platform
          from importlib.metadata import version
          declaradas = {}
          for linea in open("requirements.txt", encoding="utf-8"):
              linea = linea.split("#", 1)[0].strip()
              if "==" in linea:
                  paquete, ver = linea.split("==", 1)
                  declaradas[paquete.lower()] = ver
          modulos = {"pandas": "pandas", "numpy": "numpy", "scikit-learn": "sklearn", "matplotlib": "matplotlib"}
          for paquete, ver in declaradas.items():
              if paquete in modulos:
                  importlib.import_module(modulos[paquete])
              instalada = version(paquete)
              assert instalada == ver, f"{paquete}: instalada {instalada}, declarada {ver}"
              print(f"[OK] {paquete:<13} {instalada}")
          print("Sistema:", platform.system(), platform.machine(), "· Python", platform.python_version())
